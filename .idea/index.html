
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Generator</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #afa9a9;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            resize: vertical;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #generate {
            background: #222;
            color: white;
        }

        #clear {
            background: #ddd;
            color: #222;
        }

        #qrcode {
            margin: 25px auto 10px;
            display: flex;
            justify-content: center;
            min-height: 10px;
        }

        #download {
            display: none;
            background: #28a745;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        #message {
            margin-top: 10px;
            color: #d00;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QR Generator</h1>

    <textarea id="text" placeholder="Напиши текст или URL..."></textarea>

    <button id="generate">Генерирай QR код</button>

    <button id="clear">Изчисти</button>

    <div id="message"></div>

    <div id="qrcode"></div>

    <a id="download" download="qr-code.png">Изтегли QR кода</a>

</div>

<script>
    const textInput = document.getElementById("text");
    const qrContainer = document.getElementById("qrcode");
    const message = document.getElementById("message");
    const downloadButton = document.getElementById("download");

    document.getElementById("generate").addEventListener("click", function () {

        const text = textInput.value.trim();

        message.textContent = "";
        qrContainer.innerHTML = "";
        downloadButton.style.display = "none";

        if (!text) {
            message.textContent = "Моля, въведи текст или URL.";
            return;
        }

        new QRCode(qrContainer, {
            text: text,
            width: 250,
            height: 250,
            correctLevel: QRCode.CorrectLevel.H
        });

        setTimeout(function () {

            const canvas = qrContainer.querySelector("canvas");

            if (canvas) {
                downloadButton.href = canvas.toDataURL("image/png");
                downloadButton.style.display = "block";
            }

        }, 100);
    });

    document.getElementById("clear").addEventListener("click", function () {
        textInput.value = "";
        qrContainer.innerHTML = "";
        message.textContent = "";
        downloadButton.style.display = "none";
    });
</script>

</body>
</html>
